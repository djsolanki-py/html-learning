<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe, Audio and Video</title>
</head>

<body>

    <h1>HTML Iframe, Audio and Video</h1>

    <!-- Iframe Example -->
    <h2>Iframe</h2>

    <iframe  src="list_in.html" title="List HTML Page" width="600" height="300">
    </iframe>

    <br><br>

    <!-- Audio Example -->
    <h2>Audio</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <br><br>

    <!-- Video Example -->
    <h2>Video</h2>

    <video width="600" height="300" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

</body>
</html>
