<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Practice</title>
</head>

<body>

    <h1>Online Order</h1>

    <table border="1">
        <tr>
            <th>Description</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Email Account Details</th>
        </tr>

        <tr>
            <td>Email Account</td>
            <td>10</td>
            <td>$9.90</td>

            <td rowspan="5">
                <table border="1">
                    <tr>
                        <th>Feature</th>
                        <th>Details</th>
                    </tr>

                    <tr>
                        <td>Mailbox</td>
                        <td>10GB</td>
                    </tr>

                    <tr>
                        <td>Webmail</td>
                        <td>Yes</td>
                    </tr>

                    <tr>
                        <td>POP3</td>
                        <td>Yes</td>
                    </tr>

                    <tr>
                        <td>IMAP</td>
                        <td>Yes</td>
                    </tr>

                    <tr>
                        <td>Anti-spam</td>
                        <td>Yes</td>
                    </tr>
                </table>
            </td>
        </tr>

        <tr>
            <td>Website Advertisement</td>
            <td>1</td>
            <td>$99.00</td>
        </tr>

        <tr>
            <td>1-Year Access</td>
            <td>1</td>
            <td>$199.00</td>
        </tr>

        <tr>
            <td colspan="2">Shipping</td>
            <td>$3.99</td>
        </tr>

        <tr>
            <td colspan="2">Tax</td>
            <td>$15.99</td>
        </tr>

    </table>

</body>

</html>
