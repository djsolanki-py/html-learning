<!doctype html>
<html>
	<head>
		<title>Table Of Rowspan And colspan</title>
	</head>
		<body>
			<center><h2>Table Using Rowspan And Colspan</h2></center>
			<center><table border="1">
			<tr>
				<th colspan="4">Table Using Rowspan And Colspan</th>
			</tr>
			<tr>
				<th colspan="4">Khanewal Self Store</th>
			</tr>
			<tr>
				<th>Item/Desc</th>
				<th>QTY</th>
				<th>Price</th>
				<th>Total</th>
			</tr>
			<tr>
				<td>Sugger</td>
				<td rowspan="2">7Kg</td>
				<td>50</td>
				<td>250</td>
			</tr>
			<tr>
				<td>Cooking Oil</td>
				<td>200</td>
				<td>400</td>
			</tr>
			<tr>
				<td>Soap</td>
				<td>4 pices</td>
				<td>40</td>
				<td>160</td>
			</tr>
			<tr>
				<td colspan="3">Sub Total</td>
				<td>810</td>
			</tr>
			<tr>
				<td colspan="2">Tax</td>
				<td>5%</td>
				<td>41</td>
			</tr>
			<tr>
			<td colspan="3">Total Bill</td>
			<td>851</td>
			</tr>
			</table></center>
		</body>
</html>
